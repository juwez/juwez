  <style>
    .rule{stroke:#D0D8DC;stroke-width:1}
    .tick{stroke:#B9C4CA;stroke-width:1.5}
    .dot{fill:#1B2228;animation:lite .38s ease-out backwards}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.16em}
    .muted{fill:#5A666E}
    .ink{fill:#151A1F}
    .amber{fill:#B05F00}
    @keyframes lite{from{opacity:0}to{opacity:1}}
    @keyframes sweep{
      0%{transform:translateX(0);opacity:0}
      10%{opacity:.85}
      90%{opacity:.85}
      100%{transform:translateX(580px);opacity:0}
    }
    .scan{animation:sweep 1.05s ease-out forwards}
    @media (prefers-reduced-motion: reduce){
      .dot{animation:none}
      .scan{display:none}
    }
    .k0{animation-delay:0s}
    .k1{animation-delay:0.03s}
    .k2{animation-delay:0.06s}
    .k3{animation-delay:0.09s}
